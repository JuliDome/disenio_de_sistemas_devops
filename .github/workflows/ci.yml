name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombre de imagen GHCR
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: docker build -t disenio_de_sistemas_devops:test .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            disenio_de_sistemas_devops:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Etiquetar imágenes (GHCR y Docker Hub)
        run: |
          docker tag disenio_de_sistemas_devops:test ${{ steps.image.outputs.name }}:${GITHUB_SHA::7}
          docker tag disenio_de_sistemas_devops:test ${{ steps.image.outputs.name }}:latest
          docker tag disenio_de_sistemas_devops:test ${{ secrets.DOCKER_USERNAME }}/disenio_de_sistemas_devops:${GITHUB_SHA::7}
          docker tag disenio_de_sistemas_devops:test ${{ secrets.DOCKER_USERNAME }}/disenio_de_sistemas_devops:latest

      - name: Publicar imágenes en GHCR
        run: |
          docker push ${{ steps.image.outputs.name }}:${GITHUB_SHA::7}
          docker push ${{ steps.image.outputs.name }}:latest

      - name: Publicar imágenes en Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/disenio_de_sistemas_devops:${GITHUB_SHA::7}
          docker push ${{ secrets.DOCKER_USERNAME }}/disenio_de_sistemas_devops:latest